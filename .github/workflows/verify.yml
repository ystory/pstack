name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check release identity
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-release-identity.ts --base "$RELEASE_BASE"
      - name: Report missing release baseline
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Release identity check not run. Manual workflow has no comparison baseline.'
      - run: pnpm verify
